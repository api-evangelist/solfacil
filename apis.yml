aid: solfacil
name: Solfacil
description: 'Solfacil is a Brazilian clean-energy fintech and photovoltaic distributor that operates the largest
  solar-energy ecosystem in Latin America. Through a B2B2C model it connects more than 20,000 partner solar
  integrators to 100% digital solar financing (approval in ~30 seconds, terms up to 120 months), distribution
  of homologated PV equipment (own branches in Jundiai-SP, Jaboatao dos Guararapes-PE and Tubarao-SC), the
  Solfacil Smart monitoring and asset-management platform, battery/BESS storage, insurance products, and the
  Solfacil Academy training programs. Financial products are regulated by the Banco Central do Brasil via
  Solfacil SCFI S.A. Surfaced as a portfolio company of Fifth Wall and QED Investors; no public developer API
  was found - the customer surface is the partner Integrator Portal, storefront, and monitoring platform.'
